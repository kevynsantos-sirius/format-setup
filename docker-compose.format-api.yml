name: format

services:
  api:
    container_name: format-api
    build:
      context: ./format-api
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    extra_hosts:
      - "auth.format.local:host-gateway"
    volumes:
      - format-output:/app/Format/SYS/GERADOS
      - ./logs/format-api:/app/logs
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: "8082"
      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=60 -Xms128m -Xmx512m"
      LOGGING_FILE_NAME: /app/logs/format-api.log
      WINEDEBUG: -all
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-formatdb}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-format}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-format123}
      FORMAT_EXECUTABLE_PATH: /app/Format/SYS/FormatBSP.exe
      FORMAT_WORKDIR_PATH: /app/Format/SYS
      FORMAT_TEMPDIR_PATH: /tmp/format
      FORMAT_OUTPUT_DIR: GERADOS
      FORMAT_OUTPUT_STORAGE: ${FORMAT_OUTPUT_STORAGE:-s3}
      FORMAT_PROCESS_TIMEOUT_MINUTES: ${FORMAT_PROCESS_TIMEOUT_MINUTES:-30}
      FORMAT_ASYNC_CORE_POOL_SIZE: ${FORMAT_ASYNC_CORE_POOL_SIZE:-1}
      FORMAT_ASYNC_MAX_POOL_SIZE: ${FORMAT_ASYNC_MAX_POOL_SIZE:-2}
      FORMAT_ASYNC_QUEUE_CAPACITY: ${FORMAT_ASYNC_QUEUE_CAPACITY:-15}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://auth.format.local
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://auth:8090/oauth2/jwks
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-http://localstack:4566}
      AWS_S3_BUCKET: ${FORMAT_API_S3_BUCKET:-format-api-bucket}
      AWS_S3_AUTO_CREATE_BUCKET: ${AWS_S3_AUTO_CREATE_BUCKET:-true}
      AWS_S3_PATH_STYLE_ACCESS: ${AWS_S3_PATH_STYLE_ACCESS:-true}
    mem_limit: 900m
    cpus: 1.0
    networks:
      - format-network
    restart: unless-stopped

networks:
  format-network:
    name: format-network

volumes:
  format-output:
    name: format-output


