# Bloco default - rejeita requisicoes sem server_name correspondente
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name web.format.local;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream http://web:8081;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}

server {
    listen 80;
    server_name api.format.local;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream http://api:8082;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        # Permitir uploads maiores (até 10MB)                                 
        client_max_body_size 100M;
        client_body_buffer_size 100M;
    }
}