# Bloco default - rejeita requisicoes sem server_name correspondente
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/ssl/format.local.crt;
    ssl_certificate_key /etc/nginx/ssl/format.local.key;

    return 444;
}

server {
    listen 80;
    listen 443 ssl;
    server_name auth.format.local;

    ssl_certificate /etc/nginx/ssl/format.local.crt;
    ssl_certificate_key /etc/nginx/ssl/format.local.key;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream http://auth:8090;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix /;
        proxy_buffer_size 64k;
        proxy_buffers 8 64k;

         # CORS
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, PUT, DELETE';
            add_header Access-Control-Allow-Headers 'Authorization,Content-Type,Accept,Origin,User-Agent,DNT,Cache-Control,X-Mx-ReqToken,Keep-Alive,X-Requested-With,If-Modified-Since';
            add_header Access-Control-Allow-Credentials true;
    }
}

server {
    listen 80;
    listen 443 ssl;
    server_name web.format.local;

    ssl_certificate /etc/nginx/ssl/format.local.crt;
    ssl_certificate_key /etc/nginx/ssl/format.local.key;

    client_max_body_size 100M;
    client_body_buffer_size 100M;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream http://web:8081;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

         # CORS
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, PUT, DELETE';
            add_header Access-Control-Allow-Headers 'Authorization,Content-Type,Accept,Origin,User-Agent,DNT,Cache-Control,X-Mx-ReqToken,Keep-Alive,X-Requested-With,If-Modified-Since';
            add_header Access-Control-Allow-Credentials true;
    }
}

